# CIRCArt Preview — downloads card-pack images (public domain, Wikimedia
# Commons) once, resizes them, and stores them under year-free names:
# pack-art/<key>.jpg (kept between builds) and docs/art/<key>.jpg (live).
name: pack-images
on:
  push:
    branches: [main]
    paths: ["pack_images.json", ".github/workflows/pack-images.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pack-images
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Download missing images
        run: |
          set -e
          mkdir -p pack-art docs/art
          python3 - <<'PY'
          import json, os, subprocess, time
          items = json.load(open("pack_images.json"))
          ua = "CIRCArtPreview/1.0 (https://github.com/nambatu/circart-preview; art quiz game)"
          ok = fail = 0
          for it in items:
              key, urls = it["key"], it.get("urls") or [it.get("url")]
              dst = f"pack-art/{key}.jpg"
              if os.path.exists(dst) or not any(urls):
                  continue
              tmp = f"/tmp/{key}"
              got = False
              for url in [u for u in urls if u]:          # thumbnail → original → Special:FilePath
                  r = subprocess.run(["curl", "-sSfL", "--retry", "2", "-A", ua, "-o", tmp, url])
                  if r.returncode == 0:
                      got = True; break
                  time.sleep(1)
              if not got:
                  print("FAILED", key, urls); fail += 1; continue
              try:
                  from PIL import Image, ImageOps
                  im = ImageOps.exif_transpose(Image.open(tmp)).convert("RGB")
                  im.thumbnail((1000, 1000))
                  im.save(dst, "JPEG", quality=82, optimize=True, progressive=True)
              except Exception as e:
                  print("CONVERT FAILED", key, e); fail += 1; continue
              subprocess.run(["cp", dst, f"docs/art/{key}.jpg"])
              ok += 1
              time.sleep(0.5)          # be polite to Wikimedia
          print(f"downloaded {ok}, failed {fail}")
          PY
      - name: Commit
        run: |
          git config user.name "circart-preview-bot"
          git config user.email "circart-preview-bot@users.noreply.github.com"
          git add pack-art docs/art
          if ! git diff --cached --quiet; then
            git commit -q -m "Pack images"
            git pull -q --rebase && git push -q
          fi
