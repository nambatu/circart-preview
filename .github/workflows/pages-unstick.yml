# Cancels a GitHub Pages deployment that got stuck (it blocks every newer one).
# Runs on push when this file changes, or by hand from the Actions tab.
name: pages-unstick
on:
  push:
    branches: [main]
    paths: [".github/workflows/pages-unstick.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unstick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      deployments: write
      contents: read
    steps:
      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for sha in 6cd1b001dd13347a6a7e73aa1e3a3c11e4620df6 5f99addb1e3fb9f698378870f69ecacf27b149af; do
            echo "cancel $sha"
            gh api -X POST "repos/${REPO}/pages/deployments/${sha}/cancel" || true
          done
